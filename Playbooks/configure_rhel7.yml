---
- name: Baseline Configuration for RHEL 7 Server
  hosts: rhel7_servers
  become: true
  vars:
    system_timezone: "UTC"

  tasks:
    - name: Set system timezone
      timezone:
        name: "{{ system_timezone }}"
      tags: [timezone, system]

    - name: Ensure essential administration packages are installed
      yum:
        name:
          - git
          - curl
          - wget
          - vim
          - htop
          - tmux
          - chrony
        state: present
      tags: [packages, tools]

    - name: Ensure chronyd (NTP) service is running and enabled
      service:
        name: chronyd
        state: started
        enabled: true
      tags: [time, chrony]

    - name: Apply baseline kernel parameters for security
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-custom-baseline.conf
        reload: true
      loop:
        - { key: 'net.ipv4.conf.all.accept_source_route', value: '0' }
        - { key: 'fs.protected_hardlinks', value: '1' }
        - { key: 'fs.protected_symlinks', value: '1' }
      tags: [sysctl, kernel]